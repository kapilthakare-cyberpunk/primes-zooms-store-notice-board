<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primes & Zooms — Notice Board Publisher</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Open Sans', sans-serif;
    background: #f5f5f5;
    color: #222;
    padding: 40px 20px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 {
    font-family: 'Barlow Semi Condensed', sans-serif;
    color: #cb1513;
    font-size: 32px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .subtitle { color: #777; font-size: 14px; margin-bottom: 32px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .card h2 {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 18px;
    color: #2E4057;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .row {
    display: grid;
    grid-template-columns: 60px 1fr 2fr 2fr auto;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
  }
  .row.header {
    font-weight: 700;
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
  }
  .row input {
    padding: 10px 12px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Open Sans', sans-serif;
    width: 100%;
  }
  .row input:focus { outline: none; border-color: #cb1513; }
  .row .slot-badge {
    width: 40px; height: 40px;
    background: #cb1513; color: #fff;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 700; font-size: 18px;
  }
  .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  button {
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: #cb1513; color: #fff; }
  .btn-primary:hover { background: #a31110; }
  .btn-secondary { background: #2E4057; color: #fff; }
  .btn-secondary:hover { background: #1e2d42; }
  .btn-ghost { background: #fff; color: #2E4057; border: 1.5px solid #2E4057; }
  .btn-ghost:hover { background: #f5f5f5; }
  .error {
    color: #cb1513;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
  .success {
    color: #1a7f37;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }

  /* ─── PREVIEW MODE ─── */
  .preview-section { display: none; }
  .preview-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
  }
  .preview-actions { display: flex; gap: 12px; }

  @media print {
    body { background: #fff; padding: 0; }
    .no-print { display: none !important; }
    .preview-section { display: block !important; }
    .preview-frame {
      width: 297mm; height: 420mm; border: none; margin: 0; padding: 0;
    }
  }
</style>
</head>
<body>
<div class="container">

  <!-- EDITOR -->
  <div id="editor" class="no-print">
    <h1>Notice Board Publisher</h1>
    <p class="subtitle">Enter new arrival details below. Minimum <strong>5 items</strong> required to publish.</p>

    <div class="card">
      <h2>New Arrivals</h2>
      <div class="row header">
        <div>Slot</div>
        <div>Name</div>
        <div>Description</div>
        <div>Product URL</div>
        <div></div>
      </div>
      <div id="rows"></div>
      <div id="error" class="error">Please fill in all 5 slots before publishing.</div>
      <div id="success" class="success">Published successfully!</div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="publish()">Publish A3 Poster</button>
      <button class="btn-secondary" onclick="downloadJSON()">Download items.json</button>
      <button class="btn-ghost" onclick="resetForm()">Reset</button>
    </div>
  </div>

  <!-- PREVIEW -->
  <div id="preview" class="preview-section">
    <div class="preview-header no-print">
      <h1>Published Poster</h1>
      <div class="preview-actions">
        <button class="btn-primary" onclick="window.print()">Print A3 Poster</button>
        <button class="btn-secondary" onclick="downloadPosterHTML()">Download Poster HTML</button>
        <button class="btn-ghost" onclick="downloadStripsHTML()">Download Strips HTML</button>
        <button class="btn-ghost" onclick="backToEditor()">Back to Editor</button>
      </div>
    </div>
    <iframe id="posterFrame" class="preview-frame" style="width:297mm;height:420mm;border:none;"></iframe>
  </div>

</div>

<script>
const SLOTS = 5;
let items = Array.from({length: SLOTS}, (_, i) => ({ slot: i+1, name: '', desc: '', url: '' }));

function initRows() {
  const wrap = document.getElementById('rows');
  wrap.innerHTML = '';
  items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="slot-badge">${item.slot}</div>
      <input type="text" placeholder="Product name" data-i="${i}" data-f="name" value="${item.name}">
      <input type="text" placeholder="Short description" data-i="${i}" data-f="desc" value="${item.desc}">
      <input type="url" placeholder="https://primesandzooms.com/..." data-i="${i}" data-f="url" value="${item.url}">
    `;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      items[e.target.dataset.i][e.target.dataset.f] = e.target.value;
    });
  });
}

function validate() {
  const missing = items.filter(it => !it.name.trim() || !it.desc.trim() || !it.url.trim());
  return missing.length === 0;
}

function publish() {
  const err = document.getElementById('error');
  const ok = document.getElementById('success');
  err.style.display = 'none';
  ok.style.display = 'none';

  if (!validate()) {
    err.style.display = 'block';
    return;
  }

  const posterHTML = buildPosterHTML();
  const stripsHTML = buildStripsHTML();

  document.getElementById('editor').style.display = 'none';
  document.getElementById('preview').style.display = 'block';

  const frame = document.getElementById('posterFrame');
  frame.srcdoc = posterHTML;

  // store strips for download
  window._stripsHTML = stripsHTML;
  window._posterHTML = posterHTML;
  window._itemsJSON = JSON.stringify({ items }, null, 2);

  ok.style.display = 'block';
}

function buildPosterHTML() {
  const slots = items.map(it => `
      <div class="slot">
        <div class="slot-num">${it.slot}</div>
        <div class="slot-body">
          <div class="slot-label">Equipment Name</div>
          <div class="slot-name">${escapeHTML(it.name)}</div>
          <div class="slot-sub">${escapeHTML(it.desc)}</div>
        </div>
      </div>`).join('');

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Primes & Zooms — New Arrivals Notice Board</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: 297mm 420mm; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1123px; height: 1587px; overflow: hidden; }
  body { width: 1123px; height: 1587px; font-family: 'Open Sans', sans-serif; background: #ffffff; margin: 0; padding: 0; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .poster { width: 1123px; height: 1587px; display: flex; flex-direction: column; margin: 0; padding: 0; overflow: hidden; }
  .header { background: #cb1513; height: 140px; padding: 0 90px; display: flex; align-items: center; justify-content: center; gap: 45px; flex-shrink: 0; }
  .header .brand-text { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 28px; color: #fff; text-transform: uppercase; letter-spacing: 1px; line-height: 1.3; }
  .title-section { text-align: center; padding: 60px 80px 20px; flex-shrink: 0; }
  .title-section h1 { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 72px; color: #cb1513; text-transform: uppercase; letter-spacing: 4px; line-height: 1; }
  .title-section .sub { font-family: 'Open Sans', sans-serif; font-weight: 400; font-size: 18px; color: #777; margin-top: 16px; }
  .divider { width: 50%; height: 3px; background: linear-gradient(90deg, transparent, #cb1513, transparent); margin: 24px auto 40px; flex-shrink: 0; }
  .slots { flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 0 80px; }
  .slot { flex: 1; display: flex; align-items: stretch; border: 2px solid #e0e0e0; border-radius: 12px; overflow: hidden; min-height: 170px; background: #fafafa; }
  .slot-num { background: #cb1513; color: #fff; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 36px; width: 85px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .slot-body { flex: 1; padding: 24px 38px; display: flex; flex-direction: column; justify-content: center; }
  .slot-label { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
  .slot-name { font-family: 'Open Sans', sans-serif; font-weight: 700; font-size: 26px; color: #333; line-height: 1.2; border-bottom: 1.5px dashed #ccc; padding-bottom: 10px; min-height: 40px; }
  .slot-sub { font-family: 'Open Sans', sans-serif; font-weight: 400; font-size: 15px; color: #888; margin-top: 10px; min-height: 22px; }
  .footer { background: #333; height: 80px; padding: 0 90px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .footer .url { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 20px; color: #cb1513; letter-spacing: 0.5px; }
  .footer .info { font-family: 'Open Sans', sans-serif; font-weight: 400; font-size: 14px; color: #999; text-align: right; line-height: 1.6; }
  @media print { html, body, .poster { width: 297mm; height: 420mm; } }
</style>
</head>
<body>
  <div class="poster">
    <div class="header"><div class="brand-text">Primes &amp; Zooms</div></div>
    <div class="title-section"><h1>New Arrivals</h1><div class="sub">Fresh gear just added to our rental inventory</div></div>
    <div class="divider"></div>
    <div class="slots">${slots}</div>
    <div class="footer"><div class="url">primesandzooms.com</div><div class="info">Have questions? Please ask for our sales team!</div></div>
  </div>
</body>
</html>`;
}

function buildStripsHTML() {
  const stripDivs = items.map((it, i) => {
    const qrDivId = `qr-${i}`;
    return `
    <div class="strip">
      <div class="slot-num">${String(it.slot).padStart(2,'0')}</div>
      <div class="strip-body">
        <div class="strip-info">
          <h3>${escapeHTML(it.name)}</h3>
          <div class="desc">${escapeHTML(it.desc)}</div>
        </div>
        <div class="qrcode-wrap" id="${qrDivId}"></div>
      </div>
    </div>
    ${i < items.length - 1 ? `<div class="cut-line"><span class="dash"></span><span class="label">cut</span><span class="dash"></span></div>` : ''}`;
  }).join('');

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Primes & Zooms — Notice Board Strips</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"><\/script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: 297mm 420mm; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1123px; height: 1587px; }
  body { width: 1123px; height: 1587px; font-family: 'Open Sans', sans-serif; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; display: flex; flex-direction: column; align-items: center; padding: 80px 0 60px; }
  .page-title { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 22px; color: #cb1513; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 6px; }
  .page-sub { font-size: 12px; color: #999; margin-bottom: 36px; letter-spacing: 1px; }
  .strips-wrap { display: flex; flex-direction: column; align-items: center; }
  .strip { width: 963px; height: 204px; display: flex; align-items: stretch; background: #fff; border: 2px solid #e0e0e0; border-radius: 12px; overflow: hidden; }
  .slot-num { background: #cb1513; color: #fff; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 36px; width: 85px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .strip-body { flex: 1; padding: 20px 32px; display: flex; align-items: center; gap: 24px; }
  .strip-info { flex: 1; min-width: 0; }
  .strip-info h3 { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 28px; color: #222; line-height: 1.2; margin-bottom: 4px; }
  .strip-info .desc { font-size: 14px; color: #666; line-height: 1.3; }
  .qrcode-wrap { width: 144px; height: 144px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 6px; }
  .qrcode-wrap canvas, .qrcode-wrap img { width: 132px !important; height: 132px !important; }
  .cut-line { height: 22px; display: flex; align-items: center; justify-content: center; width: 100%; gap: 6px; }
  .cut-line .dash { display: block; width: 90px; height: 0; border-top: 1.5px dashed #bbb; }
  .cut-line .label { font-size: 9px; color: #bbb; text-transform: uppercase; letter-spacing: 2px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; }
  .page-instructions { margin-top: auto; font-size: 10px; color: #bbb; text-align: center; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="page-title">Primes &amp; Zooms — New Arrivals</div>
  <div class="page-sub">Notice Board Strips · Cut &amp; Pin onto A3 Poster</div>
  <div class="strips-wrap" id="stripsWrap">${stripDivs}</div>
  <div class="page-instructions">★ A3 · Print at 100% scale (no fit-to-page) · Cut strips · Pin onto notice board</div>
<script>
  const itemData = ${JSON.stringify(items)};
  itemData.forEach((it, i) => {
    new QRCode(document.getElementById('qr-' + i), { text: it.url, width: 132, height: 132, colorDark: '#222222', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  });
<\/script>
</body>
</html>`;
}

function escapeHTML(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function download(filename, content) {
  const blob = new Blob([content], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function downloadPosterHTML() { download('primes-and-zooms-notice-board-poster.html', window._posterHTML); }
function downloadStripsHTML() { download('primes-and-zooms-notice-board-strips.html', window._stripsHTML); }
function downloadJSON() { download('items.json', window._itemsJSON || JSON.stringify({items}, null, 2)); }

function backToEditor() {
  document.getElementById('preview').style.display = 'none';
  document.getElementById('editor').style.display = 'block';
  document.getElementById('success').style.display = 'none';
}

function resetForm() {
  items = Array.from({length: SLOTS}, (_, i) => ({ slot: i+1, name: '', desc: '', url: '' }));
  initRows();
  document.getElementById('error').style.display = 'none';
  document.getElementById('success').style.display = 'none';
}

initRows();
</script>
</body>
</html>
